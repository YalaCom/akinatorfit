name: Repair genie artwork
on:
  push:
    paths:
      - scripts/cutout.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processing dependencies
        run: python -m pip install pillow numpy opencv-python-headless
      - name: Remove white backgrounds
        run: python scripts/cutout.py
      - name: Verify transparency
        run: |
          python - <<'PY'
          from PIL import Image
          for name in ('confused','thinking','solved'):
              im=Image.open('assets/'+name+'.webp')
              assert im.mode=='RGBA' and im.getchannel('A').getextrema()==(0,255)
          PY
      - name: Commit artwork
        run: |
          git config user.name 'Akinator deployment'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/confused.webp assets/thinking.webp assets/solved.webp assets/confused.png assets/thinking.png assets/solved.png
          if ! git diff --cached --quiet; then
            git commit -m 'Remove white genie backgrounds and preserve alpha'
            git push origin HEAD:main
          fi
